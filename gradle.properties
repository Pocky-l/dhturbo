org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

## Environment
minecraft_version=26.3
minecraft_version_range=[26.3]
neo_version=26.3.0.84
# The plain Minecraft the common project compiles against (https://projects.neoforged.net/neoforged/neoform).
neo_form_version=26.3-1
loader_version_range=[1,)
# Fabric: the versions to build with; the *_min_version ones are what fabric.mod.json asks of players (Forge Config
# API Port 26.2 needs Fabric Loader 0.19.0 and Fabric API 0.152.0 itself).
fabric_loader_version=0.20.1
fabric_loader_min_version=0.19.4
fabric_api_version=0.165.0+26.3
fabric_api_min_version=0.160.6
# Forge's config API on Fabric (https://www.curseforge.com/minecraft/mc-mods/forge-config-api-port); its NeoForge
# API lets common compile Config against plain Minecraft.
forge_config_api_port_version=26.3.1

## Dependencies
distanthorizons_version=3.3.4-26.3
# The API_DATA_SOURCES generator API with rough surface data is stable since DH 3.3.
distanthorizons_range=[3.3.3,3.4)

## Mod
mod_id=dhturbo
mod_name=Turbo for Distant Horizons
mod_version=1.6.0
mod_group_id=com.pockyl.dhturbo
mod_license=MIT
mod_authors=Pocky
mod_description=Distant Horizons addon: generates distant terrain from the world noise several times faster, with real trees and structures.
mod_url=https://github.com/Pocky-l/dhturbo

## CurseForge
# Numeric project ID from the CurseForge project page ("About Project" sidebar).
curseforge_project_id=1734835
curseforge_client=true
curseforge_server=true
# Comma-separated CurseForge project slugs.
curseforge_requires=distant-horizons
curseforge_optional=
# The Fabric jar also needs Fabric API and Forge Config API Port.
curseforge_requires_fabric=distant-horizons,fabric-api,forge-config-api-port

## Modrinth
# Distant Horizons has another slug there than on CurseForge.
modrinth_requires=distanthorizons
modrinth_requires_fabric=distanthorizons,fabric-api,forge-config-api-port
# Works on either side alone: a server fills DH for its players, a client generates by itself.
modrinth_environment=client_or_server
