// The code shared by the loaders, compiled against plain Minecraft. Nothing here may use a loader API: what the
// loaders do differently goes through platform.Platform / platform.ClientPlatform.
plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev.legacyforge'
}

legacyForge {
    mcpVersion = minecraft_version
    accessTransformers.from(file('src/main/resources/META-INF/accesstransformer.cfg'))
    parchment {
        mappingsVersion = parchment_mappings_version
        minecraftVersion = parchment_minecraft_version
    }
}

dependencies {
    compileOnly 'org.spongepowered:mixin:0.8.5'
    compileOnly 'org.ow2.asm:asm-tree:9.7.1'
    // Both loaders ship MixinExtras.
    compileOnly "io.github.llamalad7:mixinextras-common:${mixinextras_version}"
    // ForgeConfigSpec: Forge's own on Forge, Forge Config API Port's on Fabric.
    compileOnly "fuzs.forgeconfigapiport:forgeconfigapiport-common:${forge_config_api_port_version}"
    // Distant Horizons ships its API inside the mod jar; only its core is used, which does not touch Minecraft.
    compileOnly "maven.modrinth:distanthorizons:${distanthorizons_version}"
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}
