plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'me.modmuss50.mod-publish-plugin' version '2.2.1'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-neoforge-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude('**/*.bbmodel')
    exclude('src/generated/**/.cache')
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup('maven.modrinth') }
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            // Separate directory, so a dedicated server can run next to the dev client.
            gameDirectory = project.file('run-server')
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Compares our columns with chunks the game really generates (compare/GenerationComparison): a normal world
        // with a fixed seed in run/compare/, report in run/compare/dhturbo-compare.txt, stops when done.
        compareServer {
            server()
            gameDirectory = project.file('run/compare')
            programArgument '--nogui'
            systemProperty 'dhturbo.compare', providers.gradleProperty('compareAreas').getOrElse('48')
            systemProperty 'dhturbo.compare.exit', 'true'
            systemProperty 'dhturbo.compare.spacings', providers.gradleProperty('compareSpacings').getOrElse('1,4')
            systemProperty 'dhturbo.compare.probe', providers.gradleProperty('compareProbe').getOrElse('')
            // -PcompareHorizon=<radius>: instead of comparing, time filling the horizon around fresh spawns.
            systemProperty 'dhturbo.compare.horizon', providers.gradleProperty('compareHorizon').getOrElse('0')
            systemProperty 'dhturbo.compare.horizonRate', providers.gradleProperty('compareHorizonRate').getOrElse('0')
            systemProperty 'dhturbo.compare.prefetch', providers.gradleProperty('comparePrefetch').getOrElse('false')
            // -PcompareJvmArgs="...": extra JVM arguments, e.g. a flight recording for profiling.
            providers.gradleProperty('compareJvmArgs').getOrElse('').split(' ').findAll { it }.each { jvmArgument it }
        }

        // Times Distant Horizons' own /dh pregen with and without this mod (compare/PregenBenchmark): a dedicated
        // server with Distant Horizons in run/pregen/, report in run/pregen/dhturbo-pregen.txt, stops when done.
        pregenServer {
            server()
            gameDirectory = project.file('run/pregen')
            programArgument '--nogui'
            systemProperty 'dhturbo.pregen', providers.gradleProperty('pregenRadius').getOrElse('64')
            systemProperty 'dhturbo.pregen.label', providers.gradleProperty('pregenLabel').getOrElse('run')
        }

        gameTestServer {
            type = 'gameTestServer'
            // Own directory: run/mods holds Distant Horizons for the dev client, which crashes the game test server.
            gameDirectory = project.file('run/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Dependencies added to localRuntime are available in dev runs but are not published as dependencies.
configurations {
    runtimeClasspath.extendsFrom localRuntime
    distantHorizons {
        transitive = false
    }
}

dependencies {
    // Distant Horizons ships its API inside the mod jar; compile against it.
    compileOnly "maven.modrinth:distanthorizons:${distanthorizons_version}"
    distantHorizons "maven.modrinth:distanthorizons:${distanthorizons_version}"
}

// Distant Horizons runs in the dev client and server as a real mod from their mods/ folders (on the classpath FML
// does not load it as a mod). Not in the game test server: DH crashes it (casts every non-integrated server to
// DedicatedServer).
var installDistantHorizonsClient = tasks.register('installDistantHorizonsClient', Copy) {
    from configurations.distantHorizons
    into 'run/mods'
}
// -PserverDh=false runs the dev server without Distant Horizons (tests client-side generation).
var serverDh = providers.gradleProperty('serverDh').map { it != 'false' }.getOrElse(true)
var installDistantHorizonsServer = serverDh
        ? tasks.register('installDistantHorizonsServer', Copy) {
            from configurations.distantHorizons
            into 'run-server/mods'
        }
        : tasks.register('removeDistantHorizonsServer', Delete) {
            // An empty copy would be skipped (NO-SOURCE) and leave the jar of an earlier run behind.
            delete fileTree('run-server/mods') { include 'distanthorizons-*.jar' }
        }
tasks.named('runClient') { dependsOn installDistantHorizonsClient }
tasks.named('runServer') { dependsOn installDistantHorizonsServer }
var installDistantHorizonsPregen = tasks.register('installDistantHorizonsPregen', Copy) {
    from configurations.distantHorizons
    into 'run/pregen/mods'
}
tasks.named('runPregenServer') { dependsOn installDistantHorizonsPregen }

// The comparison server needs an accepted EULA and a fixed seed; the watchdog is off (the comparison blocks the
// first tick for a while).
var prepareCompareServer = tasks.register('prepareCompareServer') {
    var dir = project.file('run/compare')
    // -PcompareWorld=<name>: a separate world, e.g. for a run with terrain mods in run/compare/mods.
    var levelName = providers.gradleProperty('compareWorld').getOrElse('world')
    inputs.property('levelName', levelName)
    outputs.files(new File(dir, 'eula.txt'), new File(dir, 'server.properties'))
    doLast {
        dir.mkdirs()
        new File(dir, 'eula.txt').text = 'eula=true' + System.lineSeparator()
        new File(dir, 'server.properties').text = [
                'level-seed=20261009', 'online-mode=false', 'max-tick-time=-1', 'spawn-protection=0',
                'view-distance=4', 'simulation-distance=4', 'level-name=' + levelName
        ].join(System.lineSeparator()) + System.lineSeparator()
    }
}
tasks.named('runCompareServer') { dependsOn prepareCompareServer }

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            mod_url                : mod_url,
            distanthorizons_range  : distanthorizons_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('jar', Jar) {
    def licenseName = "LICENSE_${mod_id}"
    from('LICENSE') {
        rename { licenseName }
    }
    manifest.attributes(
            'Implementation-Title': mod_name,
            'Implementation-Version': mod_version,
            'Implementation-Vendor': mod_authors,
    )
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// ---------------------------------------------------------------------------
// Release
// ---------------------------------------------------------------------------

// Returns the body of the "## [version]" section of CHANGELOG.md, or null when it is missing.
static String extractChangelog(String changelog, String version) {
    def lines = changelog.readLines()
    def start = lines.findIndexOf { it ==~ /^##\s+\[?${java.util.regex.Pattern.quote(version)}\]?(\s.*)?$/ }
    if (start < 0) {
        return null
    }
    def end = lines.findIndexOf(start + 1) { it.startsWith('## ') }
    def body = lines.subList(start + 1, end < 0 ? lines.size() : end).join('\n').trim()
    return body ?: null
}

def releaseNotes = extractChangelog(
        providers.fileContents(layout.projectDirectory.file('CHANGELOG.md')).asText.getOrElse(''),
        mod_version)
def curseforgeToken = providers.gradleProperty('curseforge_token')
        .orElse(providers.environmentVariable('CURSEFORGE_TOKEN'))

// Validates release metadata and writes the notes of the current version to build/release-notes.md.
var releaseNotesTask = tasks.register('releaseNotes') {
    group = 'publishing'
    description = 'Validates release metadata and writes notes for the current version.'

    def notes = releaseNotes
    def version = mod_version
    def projectId = curseforge_project_id
    def output = layout.buildDirectory.file('release-notes.md')
    inputs.property('notes', notes ?: '')
    inputs.property('projectId', projectId)
    outputs.file(output)

    doLast {
        if (!notes) {
            throw new GradleException("CHANGELOG.md has no non-empty section for version ${version}")
        }
        if (!(projectId ==~ /\d+/)) {
            throw new GradleException('curseforge_project_id is not set in gradle.properties')
        }
        output.get().asFile.text = notes + '\n'
    }
}

publishMods {
    file = tasks.named('jar', Jar).flatMap { it.archiveFile }
    changelog = releaseNotes ?: ''
    type = STABLE
    displayName = "${mod_name} ${mod_version}"
    modLoaders.add('neoforge')
    dryRun = providers.gradleProperty('dryRun').map { it != 'false' }.orElse(false)

    curseforge {
        projectId = curseforge_project_id
        accessToken = curseforgeToken
        minecraftVersions.add(minecraft_version)
        javaVersions.add(JavaVersion.VERSION_21)
        client = curseforge_client.toBoolean()
        server = curseforge_server.toBoolean()
        curseforge_requires.split(',')*.trim().findAll().each { requires(it) }
        curseforge_optional.split(',')*.trim().findAll().each { optional(it) }
    }
}

tasks.named('publishCurseforge') {
    dependsOn releaseNotesTask
}
